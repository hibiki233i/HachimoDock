name: Claude PR review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check Claude credentials
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo '::error::Configure CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY in this repository’s Actions secrets. See .github/README.md.'
            exit 1
          fi

      - name: Review pull request
        uses: anthropics/claude-code-action@6d5ae526d25ce88daa2200be073e1a373167f064 # v1
        with:
          github_token: ${{ github.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Read CLAUDE.md and review this pull request against the repository rules.
            The pull request branch is already checked out. Inspect the diff and
            affected callers. Report concrete correctness, compatibility, resource
            budget, and test gaps introduced by this change, with file/line evidence.
            Prioritize findings by severity and explain the triggering input and
            user-visible impact. Avoid speculative hardening and unrelated refactors.
            Do not edit files, push commits, merge, or execute project scripts.

            Use mcp__github_inline_comment__create_inline_comment with confirmed: true
            for actionable inline findings and gh pr comment for a concise summary.
            If no actionable issues are found, say so and state verification limits.
            Write review feedback in Chinese and post it to this pull request.
          claude_args: |
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"
            --disallowedTools "Edit,Write,NotebookEdit"
